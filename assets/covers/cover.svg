<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .bg { fill: #FAFAF9; }
      .text-brand { font-family: 'Inter', -apple-system, sans-serif; font-size: 56px; font-weight: 800; fill: #111827; letter-spacing: -0.03em; }
      .text-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 400; fill: #6B7280; }
      .wave-1 { stroke: #0D9488; stroke-width: 2.5; fill: none; opacity: 0.9; }
      .wave-2 { stroke: #0D9488; stroke-width: 1.5; fill: none; opacity: 0.5; }
      .wave-3 { stroke: #0D9488; stroke-width: 1.0; fill: none; opacity: 0.25; }
      .accent-dot { fill: #0D9488; opacity: 0.4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg" />

  <!-- Abstract Ambient Geometric Shapes -->
  <circle cx="200" cy="180" r="3" class="accent-dot" />
  <circle cx="1050" cy="220" r="4" class="accent-dot" />
  <circle cx="980" cy="480" r="2.5" class="accent-dot" />
  <circle cx="150" cy="450" r="3.5" class="accent-dot" />

  <!-- Flowing Waveform Centerpiece -->
  <g transform="translate(150, 200)">
    <!-- Primary Wave -->
    <path d="M 0 60 C 150 -20, 300 140, 450 60 C 600 -20, 750 140, 900 60" class="wave-1" stroke-linecap="round" />
    
    <!-- Secondary Harmonic Waves -->
    <path d="M 0 60 C 150 10, 300 110, 450 60 C 600 10, 750 110, 900 60" class="wave-2" stroke-linecap="round" />
    <path d="M 0 60 C 150 30, 300 90, 450 60 C 600 30, 750 90, 900 60" class="wave-3" stroke-linecap="round" />
    <path d="M 0 60 C 150 -50, 300 170, 450 60 C 600 -50, 750 170, 900 60" class="wave-3" stroke-linecap="round" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(0, 380)">
    <text x="600" y="50" text-anchor="middle" class="text-brand">SUBSECOND</text>
    <text x="600" y="95" text-anchor="middle" class="text-sub">Predictive voice streaming engine</text>
  </g>

</svg>
