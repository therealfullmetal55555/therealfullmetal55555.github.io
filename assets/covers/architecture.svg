<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg { fill: #FAFAF9; }
      .box { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.03)); }
      .box-active { fill: #FFFFFF; stroke: #0D9488; stroke-width: 1.5; rx: 8px; filter: drop-shadow(0 4px 16px rgba(13, 148, 136, 0.08)); }
      .text-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .text-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #6B7280; text-anchor: middle; }
      .text-accent { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #0D9488; text-anchor: middle; }
      .line { stroke: #9CA3AF; stroke-width: 1.5; fill: none; }
      .line-accent { stroke: #0D9488; stroke-width: 1.5; fill: none; }
      .line-dashed { stroke: #0D9488; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .wave { stroke: #0D9488; stroke-width: 1.5; fill: none; opacity: 0.6; }
      .arrow { fill: #9CA3AF; }
      .arrow-accent { fill: #0D9488; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-accent" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" class="bg" />

  <!-- Flowchart Nodes -->
  <!-- 1. Microphone Input -->
  <g transform="translate(100, 240)">
    <rect width="180" height="90" class="box" />
    <!-- Mic Icon -->
    <path d="M 90 25 C 86 25 83 28 83 32 L 83 44 C 83 48 86 51 90 51 C 94 51 97 48 97 44 L 97 32 C 97 28 94 25 90 25 Z M 78 40 C 78 47 83 52 90 52 C 97 52 102 47 102 40 M 90 53 L 90 59 M 84 59 L 96 59" stroke="#111827" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="90" y="74" class="text-title">Microphone Input</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 280 285 L 340 285" class="line" marker-end="url(#arrow)" />

  <!-- 2. Voice Activity Detection -->
  <g transform="translate(345, 240)">
    <rect width="210" height="90" class="box" />
    <text x="105" y="44" class="text-title">Voice Activity</text>
    <text x="105" y="62" class="text-title">Detection (VAD)</text>
    <text x="105" y="78" class="text-sub">RMS + Noise Floor &middot; 35ms</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 555 285 L 615 285" class="line-accent" marker-end="url(#arrow-teal)" />

  <!-- 3. Speculative Prediction (Central Node) -->
  <g transform="translate(620, 220)">
    <rect width="230" height="130" class="box-active" />
    <text x="115" y="42" class="text-title">Speculative Prediction</text>
    <text x="115" y="62" class="text-sub">Intent Prefetching</text>
    
    <!-- Speculative branch pill -->
    <rect x="25" y="78" width="180" height="32" rx="4" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
    <text x="115" y="98" class="text-accent">Prefetched TTFT: 85ms</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 850 285 L 910 285" class="line-accent" marker-end="url(#arrow-teal)" />

  <!-- 4. Audio Output -->
  <g transform="translate(915, 240)">
    <rect width="180" height="90" class="box" />
    <text x="90" y="48" class="text-title">Audio Output</text>
    <text x="90" y="70" class="text-sub">Total: 235ms E2E</text>
  </g>

  <!-- Speculative Branching Dotted Line -->
  <path d="M 735 220 C 735 150, 915 150, 1005 235" class="line-dashed" marker-end="url(#arrow-teal)" />
  <g transform="translate(800, 135)">
    <rect width="140" height="24" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="70" y="16" class="text-accent" style="font-size:10px;">Speculative Hit Path</text>
  </g>

  <!-- Smooth Audio Waveform Line Below -->
  <g transform="translate(100, 480)">
    <text x="500" y="-30" class="text-sub" style="letter-spacing:0.05em; font-size:11px; text-transform:uppercase;">Real-Time Acoustic Signal &middot; Continuous Waveform Flow</text>
    <path d="M 0 30 Q 75 -10, 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1000 30" class="wave" stroke-width="2" />
    <path d="M 0 30 Q 50 10, 100 30 T 200 30 T 300 30 T 400 30 T 500 30 T 600 30 T 700 30 T 800 30 T 900 30 T 1000 30" class="wave" stroke-width="1" opacity="0.3" />
  </g>

</svg>
