<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Skills Catalog</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #1e1e2e;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --accent-glow: rgba(124,58,237,0.15);
    --text: #e2e8f0;
    --muted: #64748b;
    --tag: #1e1e2e;
    --green: #10b981;
    --blue: #3b82f6;
    --orange: #f59e0b;
    --pink: #ec4899;
    --cyan: #06b6d4;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0f0f1a 0%, #1a0a2e 50%, #0a1628 100%);
    border-bottom: 1px solid var(--border);
    padding: 40px 32px 32px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: '';
    position: absolute;
    top: -20%;
    right: 10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(124,58,237,0.4);
  }
  .logo-text { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent2); }
  h1 {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, #a855f7 60%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 28px;
  }
  .subtitle code {
    background: var(--accent-glow);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--accent2);
    font-family: 'SF Mono', monospace;
    font-size: 13px;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--accent2); }
  .stat-label { font-size: 13px; color: var(--muted); }

  /* Search + Filters */
  .controls {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 32px 16px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 16px 12px 42px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="search"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  input[type="search"]::placeholder { color: var(--muted); }

  /* Category tabs */
  .tabs {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(124,58,237,0.3);
  }
  .tab .count {
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    font-size: 11px;
    padding: 1px 5px;
  }
  .tab.active .count { background: rgba(0,0,0,0.2); }

  /* Grid */
  .grid {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    transition: all .25s;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--card-accent, transparent);
    transition: opacity .3s;
    opacity: 0;
  }
  .card:hover {
    border-color: rgba(124,58,237,0.4);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(124,58,237,0.1);
  }
  .card:hover::before { opacity: 1; }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .card-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .card-cat {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-cmd {
    background: #0d0d14;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .card-cmd:hover { border-color: var(--accent); }
  .cmd-text {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: var(--accent2);
    flex: 1;
  }
  .copy-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all .15s;
  }
  .copy-btn:hover { background: var(--accent-glow); color: var(--accent2); }
  .copy-btn.copied { color: var(--green); }

  .card-hidden { display: none; }

  /* Category colors */
  .cat-marketing { --card-accent: linear-gradient(90deg, #ec4899, #a855f7); }
  .cat-cro { --card-accent: linear-gradient(90deg, #f59e0b, #ef4444); }
  .cat-design { --card-accent: linear-gradient(90deg, #06b6d4, #3b82f6); }
  .cat-engineering { --card-accent: linear-gradient(90deg, #10b981, #06b6d4); }
  .cat-docs { --card-accent: linear-gradient(90deg, #3b82f6, #6366f1); }
  .cat-sales { --card-accent: linear-gradient(90deg, #10b981, #f59e0b); }
  .cat-business { --card-accent: linear-gradient(90deg, #7c3aed, #ec4899); }
  .cat-lifestyle { --card-accent: linear-gradient(90deg, #f59e0b, #10b981); }
  .cat-seo { --card-accent: linear-gradient(90deg, #06b6d4, #10b981); }

  .icon-marketing { background: rgba(236,72,153,0.12); }
  .icon-cro { background: rgba(245,158,11,0.12); }
  .icon-design { background: rgba(6,182,212,0.12); }
  .icon-engineering { background: rgba(16,185,129,0.12); }
  .icon-docs { background: rgba(59,130,246,0.12); }
  .icon-sales { background: rgba(16,185,129,0.12); }
  .icon-business { background: rgba(124,58,237,0.12); }
  .icon-lifestyle { background: rgba(245,158,11,0.12); }
  .icon-seo { background: rgba(6,182,212,0.12); }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-marketing { background: rgba(236,72,153,0.15); color: #f9a8d4; }
  .badge-cro { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-design { background: rgba(6,182,212,0.15); color: #67e8f9; }
  .badge-engineering { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .badge-docs { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .badge-sales { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .badge-business { background: rgba(124,58,237,0.15); color: #c4b5fd; }
  .badge-lifestyle { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-seo { background: rgba(6,182,212,0.15); color: #67e8f9; }

  .no-results {
    grid-column: 1/-1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 16px;
  }

  /* Section headers */
  .section-header {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 4px;
    margin-top: 8px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  @media (max-width: 640px) {
    .header, .controls, .tabs, .grid { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: 1fr; }
    .stats { gap: 12px; }
  }
</style>
</head>
<body>

<div class="header">

      <div class="stat"><span class="stat-num">/</span><span class="stat-label">префикс команды</span></div>

</div>

<div class="controls">

<div class="grid" id="grid"></div>

let activeTab = 'all';

function catColor(cat) {
  return {
    marketing: 'marketing', cro: 'cro', seo: 'seo',
    sales: 'sales', design: 'design', engineering: 'engineering',
    docs: 'docs', business: 'business', lifestyle: 'lifestyle'
  }[cat] || 'marketing';
}

function buildGrid(filter = '') {
  const grid = document.getElementById('grid');
  const q = filter.toLowerCase();

  const visible = skills.filter(s => {
    const matchTab = activeTab === 'all' || s.cat === activeTab;
    const matchSearch = !q || s.name.includes(q) || s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.cmd.includes(q);
    return matchTab && matchSearch;
  });

  // Count by category
  const counts = {};
  ['marketing','cro','seo','sales','design','engineering','docs','business','lifestyle'].forEach(c => {
    counts[c] = skills.filter(s => s.cat === c && (!q || s.name.includes(q) || s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q))).length;
  });
  document.getElementById('cnt-all').textContent = q ? skills.filter(s => !q || s.name.includes(q) || s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q)).length : skills.length;
  Object.entries(counts).forEach(([c, n]) => {
    const el = document.getElementById('cnt-' + c);
    if (el) el.textContent = n;
  });

  if (!visible.length) {
    grid.innerHTML = '<div class="no-results">🔍 Скиллы не найдены</div>';
    return;
  }

  grid.innerHTML = visible.map(s => {
    const c = catColor(s.cat);
    return `
    <div class="card cat-${c}" data-cat="${s.cat}" data-name="${s.name}">
      <div class="card-header">
        <div class="card-icon icon-${c}">${s.icon}</div>
        <div>
          <div class="card-title">${s.title}</div>
          <div class="card-cat"><span class="badge badge-${c}">${s.cat}</span></div>
        </div>
      </div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-cmd" onclick="copyCmd('${s.cmd}', this)">
        <span class="cmd-text">${s.cmd}</span>
        <button class="copy-btn">⎘</button>
      </div>
    </div>`;
  }).join('');
}

function copyCmd(cmd, el) {
  navigator.clipboard.writeText(cmd).then(() => {
    const btn = el.querySelector('.copy-btn');
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘'; btn.classList.remove('copied'); }, 1500);
  });
}

function setTab(cat, el) {
  activeTab = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  buildGrid(document.getElementById('search').value);
}

function filterCards() {
  buildGrid(document.getElementById('search').value);
}

buildGrid();
